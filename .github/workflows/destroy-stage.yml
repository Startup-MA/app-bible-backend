name: Destroy Stage Environment

on:
  workflow_dispatch: # <--- This creates the "Turn Off" button

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install doctl (DigitalOcean CLI)
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_PAT }}
          
      - name: Connect to DigitalOcean Cluster
        run: doctl kubernetes cluster kubeconfig save bible-stage

      - name: Gracefully delete Kubernetes resources
        run: |
          echo "Attempting to delete the namespace to clear PVCs..."
          kubectl delete namespace app-bible-backend --timeout=300s --ignore-not-found || true
          echo "Kubernetes cleanup finished or bypassed. Moving to Terraform."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
        env:
          TF_WORKSPACE: "stage-cluster"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve
        env:
          TF_WORKSPACE: "stage-cluster"
          TF_VAR_do_token: ${{ secrets.DO_PAT }}