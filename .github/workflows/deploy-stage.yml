name: Deploy Stage Environment

on:
  push:
    branches:
      - stage
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Rebuild and deploy Frontend?"
        required: true
        type: boolean
        default: false    # Unchecked by default when manually clicking
jobs:
  # ==========================================
  # PHASE 1: Provision Infrastructure
  # ==========================================
  terraform:
    name: Run Terraform (DigitalOcean)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
        env:
          # Passes your DO token to Terraform
          TF_WORKSPACE: "stage-cluster"
      
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          # Passes your DO token to Terraform
          TF_WORKSPACE: "stage-cluster"
          TF_VAR_do_token: ${{ secrets.DO_PAT }}
          TF_VAR_region: "nyc3"
          TF_VAR_cluster_name: "bible-stage"
          TF_VAR_node_size: "s-2vcpu-4gb"    # Small, cheap servers for testing
          TF_VAR_node_count: 3
          TF_VAR_enable_ha: false
          TF_VAR_destroy_associated_resources: true

  # ==========================================
  # PHASE 2: Deploy Frontend to Backblaze B2
  # ==========================================
  deploy-frontend:
    name: Sync Frontend to Backblaze B2
    runs-on: ubuntu-latest
    needs: terraform # Waits for Phase 1 to finish
    if: ${{ github.event_name == 'push' || inputs.deploy_frontend == true }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Build Frontend
        working-directory: ./web-service
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.BACKEND_URL_STAGE }}
          REACT_APP_PADDLE_INITIALIZE_TOKEN: ${{ secrets.PADDLE_INITIALIZE_TOKEN_SANDBOX }}
          REACT_APP_NODE_ENV: ${{ secrets.NODE_ENV_STAGE }}
          REACT_APP_PADDLE_ENVIRONMENT: ${{ secrets.PADDLE_ENVIRONMENT_STAGE}}
        run: |
          npm ci
          npm run build

      - name: Setup Backblaze B2 CLI
        run: |
          # 1. Download the official B2 Linux binary and make it executable
          sudo curl -L -o /usr/local/bin/b2 https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux
          sudo chmod +x /usr/local/bin/b2
          
          # 2. Authorize the CLI with your account credentials
          b2 account authorize "${{ secrets.B2_KEY_ID_STAGE }}" "${{ secrets.B2_APP_KEY_STAGE }}"
          
      - name: Sync Assets to B2 Bucket
        # Syncs the built files and deletes old ones not in the build
        run: b2 sync --delete ./web-service/build b2://${{ secrets.B2_BUCKET_NAME_STAGE }}

  # ==========================================
  # PHASE 3: Deploy Backend to Kubernetes
  # ==========================================
  deploy-kubernetes:
    name: Apply K8s Manifests & Cloudflare Tunnel
    runs-on: ubuntu-latest
    needs: terraform # Waits for Phase 1 to finish

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install doctl (DigitalOcean CLI)
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_PAT }}
          
      - name: Connect to DigitalOcean Cluster
        run: doctl kubernetes cluster kubeconfig save bible-stage

      - name: Create Observability Namespace securely
        run: |
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -

      - name: Add and Update Grafana Helm Chart
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Deploy or Upgrade Loki Stack (PLG)
        run: |
          helm upgrade --install loki grafana/loki-stack \
            --namespace observability \
            --set grafana.enabled=true \
            --set promtail.enabled=true \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD_STAGE }}" \
            --set loki.persistence.enabled=true \
            --set loki.persistence.storageClassName="do-block-storage" \
            --set loki.persistence.size=10Gi \
            --set loki.resources.requests.cpu="100m" \
            --set loki.resources.requests.memory="256Mi" \
            --set loki.resources.limits.cpu="500m" \
            --set loki.resources.limits.memory="512Mi" \
            --set promtail.resources.requests.cpu="50m" \
            --set promtail.resources.requests.memory="128Mi" \
            --set promtail.resources.limits.cpu="100m" \
            --set promtail.resources.limits.memory="256Mi" \
            --set grafana.resources.requests.cpu="50m" \
            --set grafana.resources.requests.memory="128Mi" \
            --set grafana.resources.limits.cpu="100m" \
            --set grafana.resources.limits.memory="256Mi" \
            --wait --timeout 5m0s

      - name: Configure Kubernetes System Components
        run: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        
      - name: Inject Cloudflare Tunnel Secret
        # Creates the token secret securely so the cloudflared pod can boot
        run: |

          kubectl apply -f ./k8s/stage/namespace.yml

          kubectl create secret generic tunnel-token \
            --from-literal=token="${{ secrets.CF_TUNNEL_TOKEN_STAGE }}" \
            --namespace=app-bible-backend --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl apply -f ./k8s/stage/cloudflare-tunnel/cloudflare-tunnel.yml

      - name: 1. Create Dynamic Secrets
        # The --dry-run... part ensures it updates existing secrets safely without throwing an error.
        env:
          ADMIN_PASSWORDS_HASHES: ${{ secrets.ADMIN_PASSWORDS_HASHES }}
          ACCESS_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY_STAGE }}
        run: |
          # Spaces Secrets for Database Backups
          kubectl create secret generic do-spaces-creds \
            --namespace=app-bible-backend \
            --from-literal=ACCESS_KEY_ID="${{ secrets.SPACES_ACCESS_KEY_ID_STAGE }}" \
            --from-literal=ACCESS_SECRET_KEY=$ACCESS_SECRET_KEY \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic api-secrets \
            --namespace=app-bible-backend \
            --from-literal=NODE_ENV_STAGE="${{ secrets.NODE_ENV_STAGE }}" \
            --from-literal=ADMIN_EMAILS="${{ secrets.ADMIN_EMAILS }}" \
            --from-literal=ADMIN_PASSWORDS_HASHES=$ADMIN_PASSWORDS_HASHES \
            --from-literal=REDIS_SESSION_SECRET="${{ secrets.REDIS_SESSION_SECRET }}" \
            --from-literal=PADDLE_ALLOW_LIST="${{ secrets.PADDLE_SANDBOX_ALLOW_LIST }}" \
            --from-literal=PADDLE_API_KEY="${{ secrets.PADDLE_API_KEY_SANDBOX }}" \
            --from-literal=PADDLE_WEBHOOK_SECRET_KEY="${{ secrets.PADDLE_WEBHOOK_SECRET_KEY_SANDBOX_STAGE }}" \
            --from-literal=PADDLE_API_URL="${{ secrets.PADDLE_API_URL_SANDBOX }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY_STAGE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic mailers-secrets \
            --namespace=app-bible-backend \
            --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --from-literal=RESEND_FROM_ADDRESS="${{ secrets.RESEND_FROM_ADDRESS_STAGE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 2. Install CloudNativePG Operator
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.22/releases/cnpg-1.22.0.yaml
          
          kubectl rollout status deployment/cnpg-controller-manager -n cnpg-system --timeout=120s
      
      - name: 3. Deploy Infrastructure & ConfigMaps
        run: |
          # Apply your configs and databases first
          kubectl apply -f ./k8s/stage/configmaps/
          kubectl apply -f ./k8s/stage/database/
          kubectl apply -f ./k8s/stage/task-broker/
          kubectl apply -f ./k8s/stage/email-broker/
          kubectl apply -f ./k8s/stage/cache/
          
          # CRITICAL: Pause the pipeline until the databases are fully running
          kubectl wait --for=condition=Ready cluster/bible-pg-cluster -n app-bible-backend --timeout=300s
          kubectl rollout status deployment/task-broker -n app-bible-backend --timeout=120s
          kubectl rollout status deployment/redis-emails -n app-bible-backend --timeout=120s
          kubectl rollout status deployment/redis-cache -n app-bible-backend --timeout=120s

      - name: 4. Run Database Migrations & Seeding Job & Redis-Broker Setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the correct image hash
          DEV_SHA=$(gh pr list --base stage --state merged --limit 1 --json headRefOid --jq '.[0].headRefOid')
          if [ -z "$DEV_SHA" ]; then
            DEV_SHA=${{ github.sha }}
          fi

          SHORT_SHA=${DEV_SHA:0:7}

          sed -i "s/COMMIT_HASH_PLACEHOLDER/$SHORT_SHA/g" ./k8s/stage/api/migration-job.yml

          # Jobs in Kubernetes cannot be re-applied if they already finished in a previous run.
          # We must delete the old job first, ignoring errors if it doesn't exist.
          kubectl delete job api-migration-setup-job -n app-bible-backend --ignore-not-found
          
          # Apply the fresh job
          kubectl apply -f ./k8s/stage/api/migration-job.yml
          
          # CRITICAL: Pause the pipeline until the Job completes successfully
          kubectl wait --for=condition=complete job/api-migration-setup-job -n app-bible-backend --timeout=300s

      - name: 5. Deploy API Layer and Consumers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the correct image hash
          DEV_SHA=$(gh pr list --base stage --state merged --limit 1 --json headRefOid --jq '.[0].headRefOid')
          if [ -z "$DEV_SHA" ]; then
            DEV_SHA=${{ github.sha }}
          fi
          
          SHORT_SHA=${DEV_SHA:0:7}

          # Inject the hash into the application manifests
          sed -i "s/COMMIT_HASH_PLACEHOLDER/$SHORT_SHA/g" ./k8s/stage/api/api-deployment.yml ./k8s/stage/api/migration-job.yml ./k8s/stage/consumers/mailers-statefulset.yml ./k8s/stage/consumers/soldiers-statefulset.yml
          
          # Finally, apply the actual applications!
          kubectl apply -f ./k8s/stage/api/api-deployment.yml
          kubectl apply -f ./k8s/stage/consumers/
          
          # Optional: Wait for the API to be ready before marking the pipeline as "Success"
          kubectl rollout status deployment/api -n app-bible-backend --timeout=120s