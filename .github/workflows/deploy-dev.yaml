name: Deploy to Dev Droplet (Docker Hub)

on:
  push:
    branches:
      - dev

jobs:
  # PHASE 1: Build and Push Images to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Declare Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api:${{ steps.vars.outputs.sha_short }}

      - name: Build and push Emperor-Consumer
        uses: docker/build-push-action@v5
        with:
          context: ./consumers/emperor-consumer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/emperor-consumer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/emperor-consumer:${{ steps.vars.outputs.sha_short }}
      
      - name: Build and push Soldier-Consumer
        uses: docker/build-push-action@v5
        with:
          context: ./consumers/soldier-consumer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soldier-consumer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/soldier-consumer:${{ steps.vars.outputs.sha_short }}

      - name: Build and push Mailer
        uses: docker/build-push-action@v5
        with:
          context: ./consumers/mailer
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mailer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mailer:${{ steps.vars.outputs.sha_short }}

      - name: Build and push Web-Service
        uses: docker/build-push-action@v5
        with:
          context: ./web-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/web-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/web-service:${{ steps.vars.outputs.sha_short }}
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.BACKEND_URL }}
            REACT_APP_PADDLE_INITIALIZE_TOKEN=${{ secrets.PADDLE_INITIALIZE_TOKEN_SANDBOX }}
            REACT_APP_NODE_ENV=${{ secrets.NODE_ENV_DEV }}

  # PHASE 2: Deploy to Droplet (Runs only after Phase 1 succeeds)
  deploy-to-droplet:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Declare Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # NEW: Copy ONLY the docker-compose.yml file from GitHub to the Droplet
      - name: Copy docker-compose file to Droplet
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DROPLET_IP_DEV }}
          username: root
          key: ${{ secrets.DO_SSH_KEY_DEV }}
          source: "docker-compose.yaml"
          target: "/root/app-bible-backend"

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP_DEV }}
          username: root
          key: ${{ secrets.DO_SSH_KEY_DEV }}
          script: |
            cd /root/app-bible-backend
            
            # DOCKER-COMPOSE envs

            echo "IMAGE_TAG=${{ steps.vars.outputs.sha_short }}" > .env
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env

            # API envs

            echo "NODE_ENV=${{ secrets.NODE_ENV_DEV }}" > .env.api
            echo "DATABASE=${{ secrets.DATABASE }}" > .env.api
            echo "HOST=${{ secrets.HOST }}" > .env.api
            echo "PASSWORD=${{ secrets.PASSWORD }}" > .env.api
            echo "PORT=${{ secrets.PORT }}" > .env.api
            echo "USER=${{ secrets.USER }}" > .env.api
            echo "MAX=${{ secrets.MAX }}" > .env.api
            echo "CONNECTION_TIMEOUT_MILLIS=${{ secrets.CONNECTION_TIMEOUT_MILLIS }}" > .env.api
            echo "IDLE_TIMEOUT_MILLIS=${{ secrets.IDLE_TIMEOUT_MILLIS }}" > .env.api
            echo "APP_PORT=${{ secrets.API_PORT }}" > .env.api
            echo "REDIS_ROME_URL=${{ secrets.REDIS_ROME_URL }}" > .env.api
            echo "REDIS_CACHE_URL=${{ secrets.REDIS_CACHE_URL }}" > .env.api
            echo "ROME_STREAM_PRIV_NAME=${{ secrets.PRIV_STREAM_NAME }}" > .env.api
            echo "ROME_STREAM_REGULAR_NAME=${{ secrets.REGULAR_STREAM_NAME }}" > .env.api
            echo "REDIS_SESSION_SECRET=${{ secrets.REDIS_SESSION_SECRET }}" > .env.api
            echo "SALT_ROUNDS=${{ secrets.SALT_ROUNDS_DEV }}" > .env.api
            echo "PADDLE_ALLOW_LIST=${{ secrets.PADDLE_SANDBOX_ALLOW_LIST }}" > .env.api
            echo "PADDLE_API_KEY=${{ secrets.PADDLE_API_KEY_SANDBOX }}" > .env.api
            echo "PADDLE_WEBHOOK_SECRET_KEY=${{ secrets.PADDLE_WEBHOOK_SECRET_KEY_SANDBOX }}" > .env.api
            echo "PADDLE_API_URL=${{ secrets.PADDLE_API_URL_SANDBOX }}" > .env.api
            
            # EMPEROR-CONSUMER envs

            echo "NODE_ENV=${{ secrets.NODE_ENV_DEV }}" > .env.emperor-consumer
            echo "REDIS_ROME_URL=${{ secrets.REDIS_ROME_URL }}" > .env.emperor-consumer
            echo "REDIS_MAILER_URL=${{ secrets.REDIS_MAILER_URL }}" > .env.emperor-consumer
            echo "STREAM_NAME=${{ secrets.PRIV_STREAM_NAME }}" > .env.emperor-consumer
            echo "MAILER_STREAM_NAME=${{ secrets.MAILER_STREAM_NAME }}" > .env.emperor-consumer
            echo "DEAD_MESSAGES_QUEUE_NAME=${{ secrets.DEAD_MESS_PRIV_QUEUE_NAME }}" > .env.emperor-consumer
            echo "GROUP_NAME=${{ secrets.PRIV_GROUP_NAME }}" > .env.emperor-consumer
            echo "DELIVERIES_COUNTER_LIMIT=${{ secrets.DELIVERIES_COUNTER_LIMIT }}" > .env.emperor-consumer
            echo "COUNT=${{ secrets.COUNT }}" > .env.emperor-consumer
            echo "BLOCK=${{ secrets.BLOCK }}" > .env.emperor-consumer
            echo "CLAIM=${{ secrets.CLAIM }}" > .env.emperor-consumer
            echo "SLEEP=${{ secrets.SLEEP }}" > .env.emperor-consumer
            echo "DATABASE=${{ secrets.DATABASE }}" > .env.emperor-consumer
            echo "HOST=${{ secrets.HOST }}" > .env.emperor-consumer
            echo "PASSWORD=${{ secrets.PASSWORD }}" > .env.emperor-consumer
            echo "PORT=${{ secrets.PORT }}" > .env.emperor-consumer
            echo "USER=${{ secrets.USER }}" > .env.emperor-consumer
            echo "MAX=${{ secrets.MAX }}" > .env.emperor-consumer
            echo "CONNECTION_TIMEOUT_MILLIS=${{ secrets.CONNECTION_TIMEOUT_MILLIS }}" > .env.emperor-consumer
            echo "IDLE_TIMEOUT_MILLIS=${{ secrets.IDLE_TIMEOUT_MILLIS }}" > .env.emperor-consumer

            # MAILER envs

            echo "NODE_ENV=${{ secrets.NODE_ENV_DEV }}" > .env.mailer
            echo "NODE_ENV=${{ secrets.NODE_ENV_DEV }}" > .env.mailer
            echo "REDIS_MAILER_URL=${{ secrets.REDIS_MAILER_URL }}" > .env.mailer
            echo "STREAM_NAME=${{ secrets.MAILER_STREAM_NAME }}" > .env.mailer
            echo "DEAD_MESSAGES_QUEUE_NAME=${{ secrets.DEAD_MESS_EMAIL_QUEUE_NAME }}" > .env.mailer
            echo "GROUP_NAME=${{ secrets.MAILERS_GROUP_NAME }}" > .env.mailer
            echo "DELIVERIES_COUNTER_LIMIT=${{ secrets.DELIVERIES_COUNTER_LIMIT }}" > .env.mailer
            echo "COUNT=${{ secrets.COUNT }}" > .env.mailer
            echo "BLOCK=${{ secrets.BLOCK }}" > .env.mailer
            echo "CLAIM=${{ secrets.CLAIM }}" > .env.mailer
            echo "SLEEP=${{ secrets.SLEEP }}" > .env.mailer
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" > .env.mailer
            echo "RESEND_FROM_ADDRESS=${{ secrets.RESEND_FROM_ADDRESS_DEV }}" > .env.mailer

            # SOLDIER-CONSUMER envs
            echo "NODE_ENV=${{ secrets.NODE_ENV_DEV }}" > .env.soldier-consumer
            echo "REDIS_ROME_URL=${{ secrets.REDIS_ROME_URL }}" > .env.soldier-consumer
            echo "STREAM_NAME=${{ secrets.REGULAR_STREAM_NAME }}" > .env.soldier-consumer
            echo "DEAD_MESSAGES_QUEUE_NAME=${{ secrets.DEAD_MESS_REG_QUEUE_NAME }}" > .env.soldier-consumer
            echo "GROUP_NAME=${{ secrets.REG_GROUP_NAME }}" > .env.soldier-consumer
            echo "DELIVERIES_COUNTER_LIMIT=${{ secrets.DELIVERIES_COUNTER_LIMIT }}" > .env.soldier-consumer
            echo "COUNT=${{ secrets.COUNT }}" > .env.soldier-consumer
            echo "BLOCK=${{ secrets.BLOCK }}" > .env.soldier-consumer
            echo "CLAIM=${{ secrets.CLAIM }}" > .env.soldier-consumer
            echo "SLEEP=${{ secrets.SLEEP }}" > .env.soldier-consumer
            echo "DATABASE=${{ secrets.DATABASE }}" > .env.soldier-consumer
            echo "HOST=${{ secrets.HOST }}" > .env.soldier-consumer
            echo "PASSWORD=${{ secrets.PASSWORD }}" > .env.soldier-consumer
            echo "PORT=${{ secrets.PORT }}" > .env.soldier-consumer
            echo "USER=${{ secrets.USER }}" > .env.soldier-consumer
            echo "MAX=${{ secrets.MAX }}" > .env.soldier-consumer
            echo "CONNECTION_TIMEOUT_MILLIS=${{ secrets.CONNECTION_TIMEOUT_MILLIS }}" > .env.soldier-consumer
            echo "IDLE_TIMEOUT_MILLIS=${{ secrets.IDLE_TIMEOUT_MILLIS }}" > .env.soldier-consumer
            
            docker-compose pull
            docker-compose up -d
            docker image prune -a -f