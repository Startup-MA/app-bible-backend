apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mailers
  namespace: app-bible-backend
spec:
  serviceName: mailers
  replicas: 5
  selector:
    matchLabels:
      app: mailer
  template:
    metadata:
      labels:
        app: mailer
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mailer
                  
      containers:
        - name: mailer
          image: bibleapp/mailer:COMMIT_HASH_PLACEHOLDER
          
          resources:
            requests:
              cpu: "100m"       
              memory: "256Mi"   
            limits:
              cpu: "500m"       
              memory: "512Mi"   
              
          envFrom:
            - configMapRef:
                name: mailers-config
            - secretRef:
                name: mailer-credentials
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          
          ports:
            - containerPort: 3000
          
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5