apiVersion: v1
kind: ConfigMap
metadata:
  name: mailers-config
  namespace: app-bible-backend
data:
  # NODE_ENV: production
  NODE_ENV: development

  REDIS_MAILER_URL: redis://redis-emails.app-bible-backend.svc.cluster.local:6379
  STREAM_NAME: queue:emails
  DEAD_MESSAGES_QUEUE_NAME: queue:deadEmails
  GROUP_NAME: mailers
  DELIVERIES_COUNTER_LIMIT: "3"
  COUNT: "1"
  BLOCK: "0"
  CLAIM: "300000"
  SLEEP: "1000"

  REDIS_CACHE_URL: redis://redis-cache.app-bible-backend.svc.cluster.local:6379

  APP_PORT: "3000"