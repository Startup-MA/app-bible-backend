apiVersion: v1
kind: ConfigMap
metadata:
  name: task-broker-config
  namespace: app-bible-backend
data:
  redis.conf: |
    # Enable persistent storage (AOF)
    appendonly yes
    appendfsync everysec
    dir /data
    
    # Protect the Kubernetes Pod from OOMKilled errors (matches 850Mi limit)
    maxmemory 850mb
    
    # DO NOT evict data. Reject new tasks if full to prevent silent task loss.
    maxmemory-policy noeviction

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-broker-pvc
  namespace: app-bible-backend
spec:
  # Use the same DigitalOcean Block Storage class as your Postgres database
  storageClassName: do-block-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-broker
  namespace: app-bible-backend
  labels:
    app: task-broker
spec:
  replicas: 1
  # Crucial for PVCs: Ensure the old pod releases the disk before the new one boots
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-broker
  template:
    metadata:
      labels:
        app: task-broker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - task-broker
                  - redis-emails
                  - redis-cache
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: redis
        image: redis
        command: ["redis-server", "/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
          name: redis
        
        # Kubernetes Resources
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"  # Hard ceiling for the Pod
            cpu: "500m"      # Half a CPU core max
            
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
          
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: task-broker-pvc
      - name: redis-config
        configMap:
          name: task-broker-config

---
apiVersion: v1
kind: Service
metadata:
  name: task-broker
  namespace: app-bible-backend
spec:
  type: ClusterIP
  selector:
    app: task-broker
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379