apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db-cluster
  namespace: app-bible-backend
spec:
  instances: 3
  storage:
    size: 50Gi
    storageClass: do-block-storage

  bootstrap:
    initdb:
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: db-init-sql
            key: init.sql

  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
