apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: soldiers
  namespace: app-bible-backend
spec:
  serviceName: soldiers
  replicas: 2
  selector:
    matchLabels:
      app: soldier
  template:
    metadata:
      labels:
        app: soldier
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - soldier
      containers:
        - name: soldier
          image: bibleapp/soldier-consumer:COMMIT_HASH_PLACEHOLDER

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          envFrom:
            - configMapRef:
                name: soldiers-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PGHOST
              value: bible-pg-pooler-rw
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: bible-pg-cluster-app
                  key: dbname
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bible-pg-cluster-app
                  key: password
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: bible-pg-cluster-app
                  key: user
          
          ports:
            - containerPort: 3000
             
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5