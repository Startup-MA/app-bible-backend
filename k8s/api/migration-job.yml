apiVersion: batch/v1
kind: Job
metadata:
  name: api-db-migration-seeding
  namespace: app-bible-backend
spec:
  backoffLimit: 2 
  template:
    ttlSecondsAfterFinished: 600
    spec:
      restartPolicy: Never 
      containers:
      - name: migrator
        image: bibleapp/api:latest 
        
        command: ["/bin/sh", "-c", "npm run migrate:up && npm run seed && npm run redis:setup"]
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        envFrom:
          - configMapRef:
              name: api-config
          - secretRef:
              name: api-credentials
        env:
          - name: PGHOST
            value: "bible-pg-pooler-rw" 
          - name: PGPORT
            value: "5432"
          - name: PGDATABASE
            valueFrom:
              secretKeyRef:
                name: bible-pg-cluster-app
                key: dbname
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: bible-pg-cluster-app
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: bible-pg-cluster-app
                key: password