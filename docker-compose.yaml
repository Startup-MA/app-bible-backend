services:
  api:
    image: ${DOCKERHUB_USERNAME}/api:${IMAGE_TAG:-latest}
    container_name: api
    restart: unless-stopped
    ports:
      - ${API_PORT}:3000
    env_file:
      - .env.api
    depends_on:
      - task-queue
      - email-queue
      - cache
      - pg-db
  emperor-consumer:
    image: ${DOCKERHUB_USERNAME}/emperor-consumer:${IMAGE_TAG:-latest}
    container_name: emperor-consumer
    restart: unless-stopped
    env_file:
      - .env.emperor-consumer
    depends_on:
      - api
  soldier-consumer:
    image: ${DOCKERHUB_USERNAME}/soldier-consumer:${IMAGE_TAG:-latest}
    container_name: soldier-consumer
    restart: unless-stopped
    env_file:
      - .env.soldier-consumer
    depends_on:
      - api
  mailer:
    image: ${DOCKERHUB_USERNAME}/mailer:${IMAGE_TAG:-latest}
    container_name: mailer
    restart: unless-stopped
    env_file:
      - .env.mailer
    depends_on:
      - api
  web-service:
    image: ${DOCKERHUB_USERNAME}/web-service:${IMAGE_TAG:-latest}
    container_name: web-service
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT}:80
    depends_on:
      - api
  task-queue:
    image: redis
    container_name: task-queue
    restart: always
  email-queue:
    image: redis
    container_name: email-queue
    restart: always
  cache:
    image: redis
    container_name: cache
    restart: always
  rcli:
    image: "redis"
    container_name: rcli
    depends_on:
      - task-queue
      - email-queue
    command: >
      sh -c 'redis-cli -h task-queue XADD ${TASKS_STREAM_NAME} * first value;
             redis-cli -h task-queue XADD ${DEAD_MESSAGES_QUEUE_NAME} * first value;
             redis-cli -h task-queue XGROUP CREATE ${TASKS_STREAM_NAME} ${TASKS_GROUP_NAME} $$;
             redis-cli -h email-queue XADD ${EMAILS_STREAM_NAME} * first value;
             redis-cli -h email-queue XGROUP CREATE ${EMAILS_STREAM_NAME} ${MAILERS_GROUP_NAME} $$;
             redis-cli -h email-queue XADD ${DEAD_MESS_EMAIL_QUEUE_NAME} * first value;'
  pg-db:
    image: postgres
    container_name: pg-db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql


