paths:
  /api/sys/getBibleTextVersions:
    get:
      tags:
        - System
      summary: Retrieve a list of available bible text versions for specific language.
      parameters:
        - in: query
          name: language
          required: true
          schema:
            type: string
            example: English
          description: All system available languages (See /api/sys/getAllLangs)
      responses:
        200:
          description: A list of available bible text versions for a specific language.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        code:
                          type: string
                          enum:
                            - kjv
                            - niv
                          example: kjv
                        name:
                          type: string
                          enum:
                            - KJV
                            - НРП
                          example: НРП
                        full_name: 
                          type: string
                          example: King James Version
                        license:
                          type: string
                          nullable: true
                          description: |
                            License notice for this Bible text. Show it on a copyright screen for the version.
                            `null` means no license was recorded for this edition.
                            Served values fall into these types:
                            - **Public domain.** No notice is required.
                            - **CC BY 4.0.** Credit the copyright holder named in the string and link to the license. The wording may be changed.
                            - **CC BY-SA 4.0.** Credit the copyright holder and link to the license. A changed text must stay under CC BY-SA 4.0. Biblica editions keep "Biblica" in the title while the text is unchanged, and that name must be removed if the wording is changed.
                            - **CC BY-SA 3.0.** Same attribution and share-alike terms as CC BY-SA 4.0, under the 3.0 license.
                            - **Copyright status unclear** or **No license stated.** The notice is incomplete, so the text is not marked as free to reuse.
                            The enum shows one example of each form. A response may name a different copyright holder or year.
                          enum:
                            - null
                            - Public domain
                            - "CC BY 4.0. © 2018, 2019 AudioBiblia.org /Irma Flores https://creativecommons.org/licenses/by/4.0/"
                            - "CC BY-SA 4.0. © 2018 Dr. Jonathan Gallagher https://creativecommons.org/licenses/by-sa/4.0/"
                            - "CC BY-SA 4.0. © 1993, 2023 Biblica, Inc. https://creativecommons.org/licenses/by-sa/4.0/"
                            - "CC BY-SA 3.0. https://creativecommons.org/licenses/by-sa/3.0/"
                            - Copyright status unclear
                            - No license stated
                          example: "CC BY-SA 4.0. © 2018 Dr. Jonathan Gallagher https://creativecommons.org/licenses/by-sa/4.0/"
                        is_audio:
                          type: boolean
                          example: true
                        lang_name:
                          type: string
                          example: English
                        lang_code:
                          type: string
                          example: EN
                        lang_id:
                          type: integer
                          description: Id of the bible language available in the system
                          example: 1
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: language
                        message:
                          type: string
                          example: language must be one of [Albanian, Armenian, Bosnian, Bulgarian, Chinese, Croatian, Estonian, Finnish, French, Georgian, German, Greek, Hindi, Hungarian, Indonesian, Italian, Korean, Latvian, Lithuanian, Malagasy, Montenegrin, Macedonian, Norwegian, Polish, Portuguese, Romanian, Russian, English, Serbian, Slovak, Slovenian, Spanish, Swedish, Tok Pisin, Vietnamese]
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
