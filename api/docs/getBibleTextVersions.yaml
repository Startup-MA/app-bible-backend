paths:
  /api/sys/getBibleTextVersions:
    get:
      tags:
        - System
      summary: Retrieve a list of available bible text versions for specific language.
      parameters:
        - in: query
          name: language
          required: true
          schema:
            type: string
            example: English
          description: All system available languages (See /api/sys/getAllLangs)
      responses:
        200:
          description: A list of available bible text versions for a specific language.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          enum:
                            - KJV
                            - NIV
                          example: KJV
                        full_name: 
                          type: string
                          example: King James Version
                        is_audio:
                          type: boolean
                          example: true
                        lang_name:
                          type: string
                          example: English
                        lang_id:
                          type: integer
                          description: Id of the bible language available in the system
                          example: 1
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: language
                        message:
                          type: string
                          example: language must be one of [Albanian, Armenian, Bosnian, Bulgarian, Chinese, Croatian, Estonian, Finnish, French, Georgian, German, Greek, Hindi, Hungarian, Indonesian, Italian, Korean, Latvian, Lithuanian, Malagasy, Montenegrin, Macedonian, Norwegian, Polish, Portuguese, Romanian, Russian, English, Serbian, Slovak, Slovenian, Spanish, Swedish, Tok Pisin, Vietnamese]
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
