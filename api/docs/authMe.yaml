paths:
  /api/authMe:
    get:
      tags:
        - Dashboard (Requires authentication)
      summary: Sends users/customer available information (Requires authentication - "Cookie" headers field to be filled with active session).
      responses:
        200:
          description: User was successfully verified and info about him was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Customer info
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                        example: example@gmail.com
                      subscription_tier:
                        type: string
                        enum:
                        - null
                        - Thematical
                        - Advanced
                        - Premium
                        example: Premium
                      subscription_status:
                        type: string
                        enum:
                        - active
                        - trialing
                        - paused
                        - past_due
                        - canceled
                        - null
                        exmample: trialing
                      is_free_trial_used:
                        type: boolean
                        enum:
                        - true
                        - false
                        example: true
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        409:
          description: User with such id couldnt be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: No user with such id
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
