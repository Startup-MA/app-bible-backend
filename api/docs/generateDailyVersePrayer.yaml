paths:
  /api/user/generateDailyVersePrayer:
    post:
      tags:
        - User (Requires "Mobile" authentication)
      summary: It allows you to generate random verse and prayer for the user (Requires authentication - "Cookie" headers field to be filled with active mobile session).
      requestBody:
        description: Body object with the requested content language. For the available languages see /api/sys/getAllLangs.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: All system available languages (See /api/sys/getAllLangs)
                  example: English
                updated_at:
                  type: string
                  format: date-time
                  example: "2026-04-24T00:30:00+01:00"
                  description: Time when update or creation has occurred
      responses:
        200:
          description: User verse and prayer was successfully generated and sent to sync.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User generated content
                  data:
                    type: object
                    properties:
                      verse:
                        type: object
                        properties:
                          book:
                            type: string
                            example: Acts
                          chapter:
                            type: string
                            example: 20
                          verse:
                            type: string
                            example: 35
                      prayer:
                        type: object
                        properties:
                          title:
                            type: string
                            example: A Heart of Mercy and Patience
                          prayer:
                            type: string
                            example: Heavenly Father, as we reflect on Your words in Acts 20:35, remind us of the blessedness of giving and showing mercy, just as You have shown us patience and compassion. Grant us the grace to forgive those who have hurt us, to extend mercy to others, and to practice patience in all circumstances. May our hearts be filled with Your love, allowing us to emulate Your kindness and understanding. Help us to remember that in serving others with humility and mercy, we mirror the divine love You have for us. Let our lives be a testament to Your enduring patience and boundless mercy, drawing others closer to Your grace. Amen.
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: language
                        message:
                          type: string
                          example: language must be one of [Albanian, Armenian, Bosnian, Bulgarian, Chinese, Croatian, Estonian, Finnish, French, Georgian, German, Greek, Hindi, Hungarian, Indonesian, Italian, Korean, Latvian, Lithuanian, Malagasy, Montenegrin, Macedonian, Norwegian, Polish, Portuguese, Romanian, Russian, English, Serbian, Slovak, Slovenian, Spanish, Swedish, Tok Pisin, Vietnamese]
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        409:
          description: Subscription level doesn't allow to access this content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Not allowed to access. User doesn't have enough rights or an active susbscription.
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
        502:
          description: If Third-Party API service returns an error or is unavailable or provides invalid response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Service failed generating user daily content.
