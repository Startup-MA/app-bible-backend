paths:
  /api/sys/getUserTopics:
    get:
      tags:
        - User (Requires "Mobile" authentication)
      summary: Retrieves a list of all topics choosen by the user.
      responses:
        200:
          description: A list of all user topics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User topics
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        topics:
                          type: string
                          example: "Anxiety, Peace, Trust, Patience, Courage, Gratitude, Wisdom, Forgiveness, Rest, Love, Hope, Purpose, Faith, Joy, Humility, Kindness, Obedience, Mercy, Truth, Protection, Providence"
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        409:
          description: Subscription level doesn't allow to access this content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Not allowed to access. User doesn't have enough rights or an active susbscription.
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
