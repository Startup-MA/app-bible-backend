paths:
  /api/user/syncNotes:
    post:
      tags:
        - User (Requires "Mobile" authentication)
      summary: Accepts notes data objects for sync (Requires authentication - "Cookie" headers field to be filled with active mobile session).
      requestBody:
        description: Body object for sync. 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                created:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      book:
                        type: string
                        example: "Genesis"
                      chapter:
                        type: number
                        minimum: 1
                        maximum: 200
                        example: 37
                      verses_combination:
                        type: array
                        items:
                          type: string
                          description: "Available format is X or X-Y where X must be < than Y and Y <= 200"
                          example: "199-200"
                      content:
                        type: string
                        maxLength: 250
                        example: some content
                      date:
                        type: string
                        format: date-time
                        example: "2026-03-24T10:30:00+01:00"
                      uuid: 
                        type: string
                        format: uuid
                        example: 89392837-edf0-4683-ab2b-87861220a366
                      bible_id: 
                        type: integer
                        minimum: 1
                        maximum: 60
                        example: 1
                    required:
                      - book
                      - chapter
                      - verses_combination
                      - content
                      - date
                      - uuid
                      - bible_id
                updated:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      new_content:
                        type: string
                        maxLength: 250
                        example: new content
                      uuid:
                        type: string
                        format: uuid
                        description: uuid of a note you want to update
                        example: 89392837-edf0-4683-ab2b-87861220a366
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-04-24T00:30:00+00:00"
                        description: Time when update has occurred
                    required:
                      - new_content
                      - uuid
                      - updated_at
                deleted:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                    example: 89392837-edf0-4683-ab2b-87861220a366
      responses:
        200:
          description: User data was successfully validated and passed to the queue for sync.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Notes are accepted for sync
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: created,0,verses_combination,1
                        message:
                          type: string
                          example: Verse must match the correct pattern (X or X-Y)
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
