paths:
  /api/sys/getAllLangs:
    get:
      tags:
        - System
      summary: Retrieve a list of all available system languages.
      responses:
        200:
          description: A list of all available system languages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          enum:
                            - English
                            - French
                            - Russian
                          example: English
                        country_code:
                          type: string
                          example: EN
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
