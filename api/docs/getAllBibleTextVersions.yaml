paths:
  /api/sys/getAllBibleTextVersions:
    get:
      tags:
        - System
      summary: Retrieve a list of all available bible text versions.
      parameters:
        - in: query
          name: start_id
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
          description: id to start pagination from
        - in: query
          name: number
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 100
          description: number of desired elements to get in one request
      responses:
        200:
          description: A list of all available bible text versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        code:
                          type: string
                          enum:
                            - kjv
                            - niv
                          example: kjv
                        name:
                          type: string
                          enum:
                            - KJV
                            - НРП
                          example: НРП
                        full_name: 
                          type: string
                          example: King James Version
                        license:
                          type: string
                          nullable: true
                          example: Public domain
                        is_audio:
                          type: boolean
                          example: true
                        lang_name:
                          type: string
                          example: English
                        lang_id:
                          type: integer
                          description: Id of the bible language available in the system
                          example: 1
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: number
                        message:
                          type: string
                          example: number must be less than or equal to 100
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
