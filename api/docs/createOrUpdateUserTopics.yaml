paths:
  /api/user/createOrUpdateUserTopics:
    post:
      tags:
        - User (Requires "Mobile" authentication)
      summary: Accepts list of topics choosen by the user (Requires authentication - "Cookie" headers field to be filled with active mobile session).
      requestBody:
        description: Body object of choosen topics. Available topics -> Anxiety, Peace, Trust, Patience, Courage, Gratitude, Wisdom, Forgiveness, Rest, Love, Hope, Purpose, Faith, Joy, Humility, Kindness, Obedience, Mercy, Truth, Protection, Providence 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topics:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    example: "Anxiety"
                updated_at:
                  type: string
                  format: date-time
                  example: "2026-04-24T00:30:00+01:00"
                  description: Time when update or creation has occurred
      responses:
        200:
          description: User topics were successfully proccessed and passed for sync.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Topics are accepted for update
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: topics
                        message:
                          type: string
                          example: topics must contain at least 1 items
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        409:
          description: Subscription level doesn't allow to access this content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Not allowed to access. User doesn't have enough rights or an active susbscription.
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
