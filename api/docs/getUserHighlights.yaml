paths:
  /api/user/getUserHighlights:
    get:
      tags:
        - User (Requires "Mobile" authentication)
      summary: Returns user highlights object in JSON format (Requires authentication - "Cookie" headers field to be filled with active mobile session).
      parameters:
        - in: query
          name: book
          required: true
          schema:
            type: string
            example: Genesis
          description: One of the available book names Genesis, Exodus, Mark ...
        - in: query
          name: bible_id
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
          description: available bible text version id
      responses:
        200:
          description: User highlights object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      highlights: 
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 1
                            book:
                              type: string
                              example: Genesis
                            chapter:
                              type: number
                              example: 1
                            highlights_json:
                              type: object
                              properties:
                                "69,69,132,1": 
                                  type: array
                                  items:
                                    type: string
                                    example: 2
                            uuid:
                              type: string
                              format: uuid
                              example: 89392837-edf0-4683-ab2b-87861220a366
                            created_at:
                              type: string
                              format: date-time
                              example: "2026-03-24T10:30:00+01:00"
                            updated_at:
                              type: string
                              format: date-time
                              example: "2026-04-24T00:30:00+00:00"
                            bible_id:
                              type: integer
                              minimum: 1
                              example: 1
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: book
                        message:
                          type: string
                          example: book must be one of [Genesis, Exodus, Leviticus, Numbers...
        401:
          description: Authentication error (Session has expired or there is no such session).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Access forbidden
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
