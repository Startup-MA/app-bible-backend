paths:
  /api/auth/registration:
    post:
      tags:
        - Auth
      summary: Registers a new user and if successful get a verification code.
      requestBody:
        description: New user entity body. 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: some.test.email@example.com
                password:
                  type: string
                  example: SoMe1ntense@ssword
              required:
                - email
                - password
      responses:
        200:
          description: New user successfully registered and verification code is sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User registered and verification code sent
        400:
          description: Validation for the given input did not passed (Unprocessible format of the entity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Body field that did not passed the validation process.
                          example: email
                        message:
                          type: string
                          example: Please provide a valid email address
        409:
          description: Client tries to write a user which already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: User with such email already exists
        500:
          description: If internal server error occurs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message: 
                    type: string
                    example: Internal Server Error
